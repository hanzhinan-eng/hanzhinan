<html lang="ko">

<title>52주 우리말</title>
<style>
:root{
  --bg:#fbf8f2; --card:#ffffff; --ink:#2b2622; --muted:#7a7068; --line:#ece4d8;
  --a:#e9774f; --a-soft:#fdebe3;   /* 흉내말 */
  --b:#d65a8a; --b-soft:#fbe6ee;   /* 마음 말 */
  --c:#3f8fc9; --c-soft:#e3f0fa;   /* 학교·생활 말 */
  --d:#4fa46b; --d-soft:#e4f4e8;   /* 재미있는 표현 */
  --done:#f3efe7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1a17; --card:#27231f; --ink:#f2ece4; --muted:#a99f94; --line:#3a342e;
    --a-soft:#3d2a22; --b-soft:#3b2530; --c-soft:#1f3140; --d-soft:#203427; --done:#2e2a25;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1a17; --card:#27231f; --ink:#f2ece4; --muted:#a99f94; --line:#3a342e;
  --a-soft:#3d2a22; --b-soft:#3b2530; --c-soft:#1f3140; --d-soft:#203427; --done:#2e2a25;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.5px}
.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
.progress{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-bottom:20px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--d);width:0;transition:width .3s}

.now{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;margin-bottom:28px}
.now .label{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.now h2{margin:0 0 14px;font-size:20px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  padding:7px 14px;border-radius:99px;font-size:15px;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.month{font-size:15px;font-weight:700;color:var(--muted);margin:26px 0 10px}
.week{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.week.is-now{border:2px solid var(--ink)}
.week.is-done{background:var(--done)}
.whead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.wnum{font-weight:800;font-size:16px}
.wdate{color:var(--muted);font-size:13px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.t-a{background:var(--a-soft);color:var(--a)} .t-b{background:var(--b-soft);color:var(--b)}
.t-c{background:var(--c-soft);color:var(--c)} .t-d{background:var(--d-soft);color:var(--d)}
.check{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.check input{width:20px;height:20px;accent-color:var(--d);cursor:pointer}

.words{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.words{grid-template-columns:1fr}}
.word{border-radius:12px;padding:12px 14px}
.w-a{background:var(--a-soft)} .w-b{background:var(--b-soft)} .w-c{background:var(--c-soft)} .w-d{background:var(--d-soft)}
.word b{display:block;font-size:21px;letter-spacing:-.3px;margin-bottom:4px}
.word .def{font-size:15px;margin:0 0 6px}
.word .ex{font-size:15px;margin:0;color:var(--muted)}
.word .ex::before{content:"💬 "}

.tip{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--muted);margin-top:28px}
.tip p{margin:4px 0}
</style>
</head>

  </div>
</div>

       ["간이 콩알만 해지다","너무 무서워서 마음이 아주 작아지는 느낌","귀신의 집에서 간이 콩알만 해졌어."]]],

var KEY = "words52-done";
function loadDone(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function saveDone(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
var done = loadDone();
var filter = "all";

function weekStart(i){ var d=new Date(START); d.setDate(d.getDate()+i*7); return d; }
function fmt(d){ return (d.getMonth()+1)+"월 "+d.getDate()+"일"; }
function currentIndex(){
  var t=new Date(); t.setHours(0,0,0,0);
  var i=Math.floor((t-START)/(7*864e5));
  return i; // <0 시작 전, >51 끝남
}

function wordHTML(t,w){
  return '<div class="word w-'+t+'"><b>'+w[0]+'</b><p class="def">'+w[1]+'</p><p class="ex">'+w[2]+'</p></div>';
}
function weekHTML(i, big){
  var wk=WEEKS[i], t=wk[0], s=weekStart(i), e=new Date(s); e.setDate(e.getDate()+6);
  var isNow = i===currentIndex(), isDone=!!done[i];
  var h='<div class="whead"><span class="wnum">'+(i+1)+'주</span>'+
        '<span class="wdate">'+fmt(s)+' ~ '+fmt(e)+'</span>'+
        '<span class="tag t-'+t+'">'+TYPES[t].name+'</span>'+
        '<label class="check"><input type="checkbox" data-i="'+i+'"'+(isDone?' checked':'')+'> 써봤어요</label></div>'+
        '<div class="words">'+wk[1].map(function(w){return wordHTML(t,w);}).join("")+'</div>';
  if(big) return h;
  return '<article class="week'+(isNow?' is-now':'')+(isDone?' is-done':'')+'" id="w'+(i+1)+'">'+h+'</article>';
}

function renderNow(){
  var i=currentIndex(), el=document.getElementById("now");
  if(i<0){ i=0; el.innerHTML='<div class="label">곧 시작해요 · '+fmt(START)+'부터</div><h2>첫 주 단어</h2>'+weekHTML(0,true); }
  else if(i>51){ el.innerHTML='<div class="label">52주를 모두 마쳤어요</div><h2>1년 동안 104개의 말을 만났어요. 정말 뿌듯하다!</h2>'; }
  else { el.innerHTML='<div class="label">이번 주 단어</div><h2>'+TYPES[WEEKS[i][0]].hint+'</h2>'+weekHTML(i,true); }
}
function renderChips(){
  var opts=[["all","전체"]].concat(Object.keys(TYPES).map(function(k){return [k,TYPES[k].name];}));
  document.getElementById("chips").innerHTML=opts.map(function(o){
    return '<button class="chip" data-f="'+o[0]+'" aria-pressed="'+(filter===o[0])+'">'+o[1]+'</button>';
  }).join("");
}
function renderList(){
  var out="", lastMonth="";
  for(var i=0;i<52;i++){
    if(filter!=="all" && WEEKS[i][0]!==filter) continue;
    var s=weekStart(i), m=s.getFullYear()+"년 "+(s.getMonth()+1)+"월";
    if(m!==lastMonth){ out+='<div class="month">'+m+'</div>'; lastMonth=m; }
    out+=weekHTML(i,false);
  }
  document.getElementById("list").innerHTML=out;
}
function renderProgress(){
  var n=Object.keys(done).filter(function(k){return done[k];}).length;
  document.getElementById("pText").textContent=n+" / 52주";
  document.getElementById("pBar").style.width=(n/52*100)+"%";
}
function renderAll(){ renderNow(); renderChips(); renderList(); renderProgress(); }

document.addEventListener("change",function(e){
  if(e.target.matches('input[type=checkbox][data-i]')){
    var i=+e.target.dataset.i; done[i]=e.target.checked; if(!done[i]) delete done[i];
    saveDone(done); renderAll();
  }
});
document.addEventListener("click",function(e){
  var b=e.target.closest(".chip"); if(!b) return;
  filter=b.dataset.f; renderChips(); renderList();
});
renderAll();
</script>
