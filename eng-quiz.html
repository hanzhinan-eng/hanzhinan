<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>영어 퀴즈</title>
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#22303a; --soft:#6b7780;
  --main:#2f6f62; --main-2:#e3efe9; --line:#e2ddd2;
  --ok:#2f8a4e; --ok-bg:#e5f4ea; --no:#c4553b; --no-bg:#fbe9e4; --gold:#e3a33b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-bottom:14px}
h1{font-size:26px;margin:4px 0 6px}
h2{font-size:19px;margin:0 0 10px}
p{margin:6px 0}
.muted{color:var(--soft);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;
  background:var(--main);color:#fff;cursor:pointer;margin-top:12px}
.btn.ghost{background:var(--main-2);color:var(--main)}
.btn:disabled{opacity:.4}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--soft);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;background:var(--main);transition:width .3s}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--main-2);color:var(--main);margin-bottom:10px}
.q{font-size:19px;font-weight:700;margin:4px 0 12px}
.passage{background:#faf8f3;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px;margin-bottom:12px}
.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:2px dashed var(--main);
  background:var(--main-2);color:var(--main);border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:12px}
.play:disabled{opacity:.45}
.opts{display:grid;gap:10px}
.opts.grid4{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:17px;text-align:left;cursor:pointer;color:var(--ink)}
.opts.grid4 .opt{text-align:center;font-size:40px;padding:18px 8px}
.opt.sel{border-color:var(--main);background:var(--main-2)}
.big{font-size:44px;font-weight:800;color:var(--main);margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 4px;font-size:15px}
.mini{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.mini>i{display:block;height:100%}
.review{border-top:1px solid var(--line);padding:12px 0}
.review:first-child{border-top:0}
.ok{color:var(--ok);font-weight:700}.no{color:var(--no);font-weight:700}
.script{font-size:14px;color:var(--soft);background:#faf8f3;border-radius:10px;padding:8px 10px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ===== 문제 은행 =====
   band: 1=초급(6·5급 수준) 2=중급(4·3급 수준) 3=고급(2·1급 수준)
   type: 어떤 유형인지 (결과에서 약한 부분 보여줄 때 사용)
   audio: 들려줄 문장 (배열이면 두 사람 대화)
   JET와 같은 출제 방식으로 새로 만든 문제예요 (기출문제 아님) */
const Q = [
 // ---------- 듣기 ----------
 {sec:"듣기",band:1,type:"단어 듣기",q:"들은 단어에 맞는 그림을 고르세요.",audio:"umbrella",grid:true,
  opts:["☂️","🍎","🚲","🐟"],ans:0},
 {sec:"듣기",band:1,type:"단어 듣기",q:"들은 숫자를 고르세요.",audio:"thirteen",grid:true,
  opts:["13","30","3","31"],ans:0},
 {sec:"듣기",band:1,type:"문장 듣기",q:"들은 문장과 맞는 것을 고르세요.",audio:"The cat is under the table.",
  opts:["🐱 고양이가 탁자 위에 있어요","🐱 고양이가 탁자 아래에 있어요","🐶 강아지가 탁자 아래에 있어요","🐱 고양이가 의자 옆에 있어요"],ans:1},
 {sec:"듣기",band:1,type:"알맞은 대답",q:"질문을 듣고 알맞은 대답을 고르세요.",audio:"How are you today?",
  opts:["I'm fine, thank you.","I'm ten years old.","It's a pencil.","Yes, I do."],ans:0},

 {sec:"듣기",band:2,type:"대화 듣기",q:"미나는 어디에 가나요?",
  audio:["Where are you going, Mina?","I'm going to the library. I need to return some books."],
  opts:["도서관","서점","학교","공원"],ans:0},
 {sec:"듣기",band:2,type:"대화 듣기",q:"두 사람은 몇 시에 만나나요?",
  audio:["What time does the movie start?","It starts at four thirty. Let's meet at four."],
  opts:["4시","4시 30분","3시 30분","5시"],ans:0},
 {sec:"듣기",band:2,type:"알맞은 대답",q:"질문을 듣고 알맞은 대답을 고르세요.",audio:"Would you like some more juice?",
  opts:["Yes, it's my juice.","No, thanks. I'm full.","I like apples.","It's on the desk."],ans:1},
 {sec:"듣기",band:2,type:"문장 듣기",q:"말하는 사람에 대해 맞는 것을 고르세요.",audio:"My brother is taller than me, but I'm older than him.",
  opts:["남동생보다 키가 크다","남동생보다 나이가 많다","남동생과 키가 같다","남동생보다 어리다"],ans:1},

 {sec:"듣기",band:3,type:"대화 듣기",q:"우체국은 어디 옆에 있나요?",
  audio:["Excuse me, how can I get to the post office?","Go straight two blocks and turn left. It's next to the bank."],
  opts:["은행","병원","도서관","공원"],ans:0},
 {sec:"듣기",band:3,type:"대화 듣기",q:"두 번째로 말한 사람은 왜 과학 숙제를 못 끝냈나요?",
  audio:["Did you finish your science project?","Not yet. I was going to finish it last night, but my computer broke.","Oh no. You can use mine after dinner."],
  opts:["저녁을 먹느라","컴퓨터가 고장 나서","일찍 잠들어서","친구 집에 가서"],ans:1},
 {sec:"듣기",band:3,type:"알맞은 대답",q:"듣고 알맞은 대답을 고르세요.",audio:"I'm sorry I'm late. The bus didn't come for twenty minutes.",
  opts:["The bus is blue.","I'll take twenty.","That's okay. I'm glad you're here now.","No, I'm not late."],ans:2},
 {sec:"듣기",band:3,type:"문장 듣기",q:"오늘 학생들은 어디에 가나요?",
  audio:"Good morning, students. Today's field trip has changed. Because of the rain, we will visit the science museum instead of the zoo. Please bring your lunch.",
  opts:["동물원","과학관","수영장","학교 운동장"],ans:1},

 // ---------- 읽기 ----------
 {sec:"읽기",band:1,type:"낱말 고르기",q:"빈칸에 알맞은 말을 고르세요.",text:"I brush my ______ every morning.",
  opts:["teeth","books","shoes","apples"],ans:0},
 {sec:"읽기",band:1,type:"문법",q:"빈칸에 알맞은 말을 고르세요.",text:"She ______ my sister.",
  opts:["am","are","is","be"],ans:2},
 {sec:"읽기",band:1,type:"낱말 고르기",q:"빈칸에 알맞은 말을 고르세요.",text:"A banana is usually ______.",
  opts:["blue","yellow","black","purple"],ans:1},
 {sec:"읽기",band:1,type:"짧은 글 읽기",q:"What is the dog's name?",text:"Tom has a dog. Its name is Max. Max likes to run in the park.",
  opts:["Tom","Max","Park","Run"],ans:1},

 {sec:"읽기",band:2,type:"문법",q:"빈칸에 알맞은 말을 고르세요.",text:"Yesterday I ______ to the zoo with my family.",
  opts:["go","goes","went","going"],ans:2},
 {sec:"읽기",band:2,type:"문법",q:"빈칸에 알맞은 말을 고르세요.",text:"There ______ many students in the classroom.",
  opts:["is","are","am","be"],ans:1},
 {sec:"읽기",band:2,type:"낱말 고르기",q:"빈칸에 알맞은 말을 고르세요.",text:"This bag is too heavy. Can you help me ______ it?",
  opts:["eat","sing","carry","sleep"],ans:2},
 {sec:"읽기",band:2,type:"짧은 글 읽기",q:"What does Jisu do on Wednesdays?",
  text:"Jisu's school ends at 2 p.m. On Mondays and Wednesdays, she goes to swimming class after school. On Fridays, she plays soccer with her friends.",
  opts:["She plays soccer.","She goes to swimming class.","She stays at school.","She visits her friends."],ans:1},

 {sec:"읽기",band:3,type:"문법",q:"빈칸에 알맞은 말을 고르세요.",text:"If it ______ tomorrow, we will stay home.",
  opts:["rains","rained","raining","will rain"],ans:0},
 {sec:"읽기",band:3,type:"문법",q:"빈칸에 알맞은 말을 고르세요.",text:"I have lived in Seoul ______ 2015.",
  opts:["for","since","at","during"],ans:1},
 {sec:"읽기",band:3,type:"문법",q:"빈칸에 알맞은 말을 고르세요.",text:"The boy ______ is wearing a red cap is my cousin.",
  opts:["which","what","where","who"],ans:3},
 {sec:"읽기",band:3,type:"짧은 글 읽기",q:"What is the main idea?",
  text:"Many people think bats are blind, but that is not true. Bats can see. However, most bats use sound to find food at night. They make high sounds and listen to the echoes.",
  opts:["Bats cannot see at all.","Bats often use sound to find food in the dark.","Bats eat only fruit.","Bats sleep all night."],ans:1}
];

/* 단계별로 풀게 순서 정리: 초급(듣기→읽기) → 중급 → 고급 */
Q.sort((a,b)=>a.band-b.band);

/* ===== 저장 (이 기기 안에만 저장돼요) ===== */
const KEY="engquiz_history_v1";
function loadHist(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function saveHist(h){try{localStorage.setItem(KEY,JSON.stringify(h))}catch(e){}}

/* ===== 소리 (기기에 들어있는 영어 목소리 사용) ===== */
/* 목소리 A(여자)·B(남자)를 이름으로 찾아요. 남자 목소리가 없으면 A 목소리 하나로 자연스럽게 읽어요 */
let voiceA=null,voiceB=null;
const MALE=/(daniel|alex|fred|aaron|arthur|gordon|oliver|evan|nathan|rishi|tom|david|mark|guy|eric|male)/i;
const FEMALE=/(samantha|karen|moira|tessa|victoria|susan|zira|ava|allison|jenny|aria|serena|nicky|martha|female)/i;
function loadVoices(){
  if(!("speechSynthesis" in window))return;
  const all=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const us=all.filter(v=>/en[-_]US/i.test(v.lang));
  const pool=us.length?us:all;
  const pick=(re,list)=>list.find(v=>re.test(v.name)&&v.localService)||list.find(v=>re.test(v.name));
  voiceA=pick(FEMALE,pool)||pick(FEMALE,all)||pool[0]||null;
  voiceB=pick(MALE,pool)||pick(MALE,all)||null;
}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(audio,done){
  if(!("speechSynthesis" in window)){alert("이 기기에서는 소리가 나오지 않아요. 다른 브라우저로 열어보세요.");done&&done();return;}
  speechSynthesis.cancel();
  const lines=Array.isArray(audio)?audio:[audio];
  lines.forEach((t,i)=>{
    const u=new SpeechSynthesisUtterance(t);
    u.lang="en-US";u.rate=0.85;
    u.pitch=1;   // 높낮이는 건드리지 않아요 (억지로 바꾸면 어색해요)
    const v=(Array.isArray(audio)&&i%2===1&&voiceB)?voiceB:voiceA;
    if(v)u.voice=v;
    if(i===lines.length-1&&done)u.onend=done;
    speechSynthesis.speak(u);
  });
}

/* ===== 화면 ===== */
const app=document.getElementById("app");
let idx=0,answers=[],plays=0;

function home(){
  const h=loadHist();
  let hist="";
  if(h.length){
    hist=`<div class="card"><h2>지난 기록</h2><table><tr><th>날짜</th><th>점수</th><th>수준</th></tr>`+
      h.slice(-6).reverse().map(r=>`<tr><td>${r.date}</td><td>${r.score}/${r.asked||Q.length}</td><td>${r.level}</td></tr>`).join("")+
      `</table></div>`;
  }
  app.innerHTML=`
   <div class="card">
     <div class="tag">영어 레벨 퀴즈</div>
     <h1>지금 내 영어는 몇 급?</h1>
     <p>쉬운 단계부터 듣기와 읽기를 풀어요. 최대 ${Q.length}문제예요.</p>
     <p>모르는 문제는 찍지 말고 <b>🤔 모르겠어요</b>를 눌러 주세요. 그래야 진짜 실력을 알 수 있어요.</p>
     <p>어려워지면 중간에 끝날 수도 있어요. 그것도 괜찮아요!</p>
     <p class="muted">🎧 듣기 문제는 소리가 나와요. 이어폰을 끼거나 소리를 켜 주세요. 한 문제당 두 번까지 들을 수 있어요.</p>
     <p class="muted">⏱ 약 15~20분 걸려요.</p>
     <button class="btn" onclick="start()">시작하기</button>
   </div>${hist}`;
}
/* 보기 순서를 매번 섞어요 (찍기로 맞히기 어렵게) */
function shuffleOpts(){
  Q.forEach(q=>{
    const right=q.opts[q.ans];
    const a=q.opts.slice();
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    q.opts=a;q.ans=a.indexOf(right);
  });
}
function start(){shuffleOpts();idx=0;answers=[];show();}

function show(){
  const q=Q[idx];plays=0;
  const pct=Math.round(idx/Q.length*100);
  const isListen=!!q.audio;
  app.innerHTML=`
   <div class="top"><span>${q.sec} · ${idx+1} / ${Q.length}</span><span>${q.type}</span></div>
   <div class="bar"><i style="width:${pct}%"></i></div>
   <div class="card">
     ${isListen?`<button class="play" id="play" onclick="playIt()">🔊 듣기 <span id="pc">(2번 남음)</span></button>`:""}
     <div class="q">${q.q}</div>
     ${q.text?`<div class="passage">${q.text}</div>`:""}
     <div class="opts ${q.grid?"grid4":""}">
       ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="pick(${i})">${q.grid?"":(i+1)+". "}${o}</button>`).join("")}
       <button class="opt" data-i="-1" onclick="pick(-1)" style="text-align:center;color:var(--soft)">🤔 모르겠어요</button>
     </div>
     <button class="btn" id="next" disabled onclick="next()">${idx===Q.length-1?"결과 보기":"다음"}</button>
   </div>`;
  const prev=Q[idx-1];
  if(prev&&prev.band!==q.band)
    app.insertAdjacentHTML("afterbegin",`<div class="card" style="background:var(--main-2)"><b>잘했어요! 🎉</b> 다음 단계로 올라가요. 조금 더 어려워져요.</div>`);
  else if(prev&&prev.sec!==q.sec)
    app.insertAdjacentHTML("afterbegin",`<div class="card" style="background:var(--main-2)"><b>듣기 끝! 👏</b> 이번엔 읽기 문제예요. 소리는 안 나와요.</div>`);
}
let chosen=null;
function pick(i){
  chosen=i;
  document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",+b.dataset.i===i));
  document.getElementById("next").disabled=false;
}
function playIt(){
  if(plays>=2)return;
  plays++;
  const b=document.getElementById("play");b.disabled=true;
  speak(Q[idx].audio,()=>{
    if(plays<2){b.disabled=false;}
  });
  document.getElementById("pc").textContent=plays>=2?"(다 들었어요)":`(${2-plays}번 남음)`;
  // 일부 기기에서 끝 신호가 안 오는 경우 대비
  setTimeout(()=>{if(plays<2)b.disabled=false;},6000);
}
function next(){
  if(chosen===null)return;
  if("speechSynthesis" in window)speechSynthesis.cancel();
  answers[idx]=chosen;chosen=null;
  const q=Q[idx];idx++;
  // 한 단계가 끝났을 때 8문제 중 6개 미만이면 여기서 끝내요 (위 단계는 너무 어려워서 찍게 돼요)
  const bandEnd=idx>=Q.length||Q[idx].band!==q.band;
  if(bandEnd){
    let c=0;Q.forEach((x,i)=>{if(i<idx&&x.band===q.band&&answers[i]===x.ans)c++;});
    if(c<6){result();return;}
  }
  if(idx<Q.length){show();window.scrollTo(0,0);}else result();
}

/* ===== 수준 추정 =====
   단계별 8문제 중 6개 이상 맞으면 그 단계 통과로 봐요. (참고용 추정이에요) */
function estimate(b){
  if(b[1]<4)return "6급 준비 단계";
  if(b[1]<6)return "6급 수준";
  if(b[2]<4)return "5급 수준";
  if(b[2]<6)return "4급 수준";
  if(b[3]<4)return "3급 수준";
  if(b[3]<6)return "2급 수준";
  return "1급 수준";
}
function result(){
  let score=0;const band={1:0,2:0,3:0};const types={};
  const asked=answers.length;const bandN={1:0,2:0,3:0};
  Q.forEach((q,i)=>{
    if(i>=asked)return;   // 일찍 끝나서 안 푼 문제는 빼요
    bandN[q.band]++;
    const ok=answers[i]===q.ans;
    if(ok){score++;band[q.band]++;}
    types[q.type]=types[q.type]||{ok:0,n:0};
    types[q.type].n++;if(ok)types[q.type].ok++;
  });
  const level=estimate(band);
  const d=new Date();
  const date=`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
  const h=loadHist();h.push({date,score,asked,level,band,types});saveHist(h);

  const weak=Object.entries(types).filter(([k,v])=>v.ok/v.n<0.6).map(([k])=>k);
  const typeRows=Object.entries(types).map(([k,v])=>{
    const p=Math.round(v.ok/v.n*100);
    const c=p>=75?"var(--ok)":p>=50?"var(--gold)":"var(--no)";
    return `<div class="row"><span>${k}</span><span>${v.ok}/${v.n}</span></div><div class="mini"><i style="width:${p}%;background:${c}"></i></div>`;
  }).join("");
  const bandName={1:"초급 (6·5급 문제)",2:"중급 (4·3급 문제)",3:"고급 (2·1급 문제)"};
  const bandRows=[1,2,3].map(k=>`<div class="row"><span>${bandName[k]}</span><span>${bandN[k]?band[k]+"/"+bandN[k]:"안 풀었어요"}</span></div>`).join("");

  const review=Q.slice(0,asked).map((q,i)=>{
    const ok=answers[i]===q.ans;
    const script=q.audio?(Array.isArray(q.audio)?q.audio.map((t,j)=>(j%2?"B: ":"A: ")+t).join("<br>"):q.audio):"";
    return `<div class="review">
      <div><b>${i+1}.</b> ${q.q} <span class="${ok?"ok":"no"}">${ok?"○":"✕"}</span></div>
      ${q.text?`<div class="script">${q.text}</div>`:""}
      ${script?`<div class="script">🔊 ${script}</div>`:""}
      ${ok?"":`<div class="muted">내 답: ${answers[i]===-1?"🤔 모르겠어요":q.opts[answers[i]]} → 정답: <b>${q.opts[q.ans]}</b></div>`}
    </div>`;
  }).join("");

  app.innerHTML=`
   <div class="card" style="text-align:center">
     <div class="tag">결과</div>
     <p>${asked}문제 중 <b>${score}</b>개 맞았어요</p>
     <div class="big">${level}</div>
     <p class="muted">JET 급수와 비슷한 기준으로 추정한 참고용 결과예요. 실제 시험 급수와는 다를 수 있어요.</p>
   </div>
   <div class="card"><h2>단계별</h2>${bandRows}</div>
   <div class="card"><h2>유형별</h2>${typeRows}
     ${weak.length?`<p style="margin-top:14px">💪 다음에 더 연습할 부분: <b>${weak.join(", ")}</b></p>`:`<p style="margin-top:14px">🎉 모든 유형이 고르게 좋아요!</p>`}
   </div>
   <div class="card"><h2>문제 다시 보기</h2>${review}</div>
   <button class="btn ghost" onclick="home()">처음으로</button>`;
  window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
