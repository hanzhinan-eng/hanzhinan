<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 10분">
<title>영어 10분</title>
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#22303a; --soft:#6b7780;
  --main:#2f6f62; --main-2:#e3efe9; --line:#e2ddd2;
  --ok:#2f8a4e; --ok-bg:#e5f4ea; --no:#c4553b; --no-bg:#fbe9e4; --gold:#e3a33b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin-bottom:14px}
.note{background:var(--main-2);border-color:transparent}
h1{font-size:26px;margin:4px 0 6px}
h2{font-size:19px;margin:0 0 10px}
p{margin:6px 0}
.muted{color:var(--soft);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;
  background:var(--main);color:#fff;cursor:pointer;margin-top:12px;font-family:inherit}
.btn.ghost{background:var(--main-2);color:var(--main)}
.btn:disabled{opacity:.4}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--soft);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;background:var(--main);transition:width .3s}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--main-2);color:var(--main);margin-bottom:10px}
.tag.review{background:#fdf1dc;color:#9a6512}
.q{font-size:19px;font-weight:700;margin:4px 0 12px}
.passage{background:#faf8f3;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px;margin-bottom:12px}
.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:2px dashed var(--main);
  background:var(--main-2);color:var(--main);border-radius:14px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:12px;font-family:inherit}
.play:disabled{opacity:.45}
.opts{display:grid;gap:10px}
.opts.grid4{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:17px;text-align:left;cursor:pointer;color:var(--ink);font-family:inherit}
.opts.grid4 .opt{text-align:center;font-size:40px;padding:18px 8px}
.opt.idk{text-align:center;color:var(--soft)}
.opt.sel{border-color:var(--main);background:var(--main-2)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:16px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--no-bg);color:var(--no)}
.fb .script{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px;text-align:center}
.stats div{background:#faf8f3;border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:24px;color:var(--main)}
.stats span{font-size:13px;color:var(--soft)}
.big{font-size:44px;font-weight:800;color:var(--main);margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 4px;font-size:15px}
.mini{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.mini>i{display:block;height:100%}
.review{border-top:1px solid var(--line);padding:12px 0}
.review:first-child{border-top:0}
.okc{color:var(--ok);font-weight:700}.noc{color:var(--no);font-weight:700}
.script{font-size:14px;color:var(--soft);background:#faf8f3;border-radius:10px;padding:8px 10px;margin-top:6px}
.ko{font-size:20px;font-weight:700;margin:4px 0 14px}
.line{min-height:58px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--main);background:#fff;color:var(--main);border-radius:12px;padding:9px 14px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.line .chip{background:var(--main);color:#fff}
.chip.used{visibility:hidden}
.vbtn{border:1px solid var(--line);background:#fff;color:var(--main);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>

  text:"Many people think bats are blind, but that is not true. Bats can see. However, most bats use sound to find food at night. They make high sounds and listen to the echoes.",

TEST.sort((a,b)=>a.band-b.band);   // 초급(듣기→읽기) → 중급 → 고급

/* ---- 하루 10분 새 문제 (4급~3급 수준, 하루 3개씩) ---- */
const BANK=[
 {id:"p1",type:"대화 듣기",q:"두 번째 사람은 언제 피아노를 연습하나요?",audio:["Can you play the piano?","Yes, I can. I practice every day after school."],
  opts:["매일 학교 끝나고","주말에만","매일 아침","일요일 저녁"],ans:0},
 {id:"p2",type:"알맞은 대답",q:"질문을 듣고 알맞은 대답을 고르세요.",audio:"What did you do last weekend?",
  opts:["I visited my grandmother.","I will go swimming.","It's on Sunday.","Yes, I did."],ans:0},
 {id:"p3",type:"문법",q:"빈칸에 알맞은 말을 고르세요.",text:"Look! My brother ______ soccer now.",
  opts:["plays","is playing","played","play"],ans:1},
 {id:"p4",type:"낱말 고르기",q:"빈칸에 알맞은 말을 고르세요.",text:"I'm hungry. Let's ______ lunch.",
  opts:["have","drink","sleep","wear"],ans:0},
 {id:"p5",type:"짧은 글 읽기",q:"How many pets does Minho have?",text:"Minho likes animals. He has two cats and a dog. Every morning, he gives them food before school.",
  opts:["Two","Three","Four","One"],ans:1},
 {id:"p6",type:"대화 듣기",q:"손님은 모두 얼마를 내야 하나요?",audio:["How much is this T-shirt?","It's ten dollars.","Okay, I'll take two."],
  opts:["10달러","20달러","2달러","12달러"],ans:1},
 {id:"p7",type:"알맞은 대답",q:"질문을 듣고 알맞은 대답을 고르세요.",audio:"Whose bag is this?",
  opts:["It's Jimin's.","It's very big.","It's on the chair.","Yes, it is."],ans:0},
 {id:"p8",type:"문법",q:"빈칸에 알맞은 말을 고르세요.",text:"She ______ a letter to her friend yesterday.",
  opts:["write","wrote","writes","writing"],ans:1},
 {id:"p9",type:"문법",q:"빈칸에 알맞은 말을 고르세요.",text:"There ______ a big tree in the park.",
  opts:["is","are","am","be"],ans:0},
 {id:"p10",type:"낱말 고르기",q:"빈칸에 알맞은 말을 고르세요.",text:"It's very cold outside. Wear your ______.",

 {id:"p11",type:"짧은 글 읽기",q:"Who made the cake?",text:"Today is Sora's birthday. Her mom made a chocolate cake. Her friends came to her house at 5 p.m. They sang a song together.",

  opts:["use","uses","using","used"],ans:0},
 {id:"p14",type:"알맞은 대답",q:"질문을 듣고 알맞은 대답을 고르세요.",audio:"What's the weather like today?",

 {id:"p15",type:"짧은 글 읽기",q:"Where did Jun get a book?",text:"Jun wanted to buy a new book. But the bookstore was closed. So he went to the library and borrowed one.",

/* ---- 영작 1칸: 단어 카드 순서 맞추기 (하루 1개) ---- */
const WRITE=[
 {id:"w1",ko:"나는 마라탕을 좋아해요.",words:["I","like","mala tang"],end:"."},
 {id:"w2",ko:"나는 피아노를 쳐요.",words:["I","play","the piano"],end:"."},
 {id:"w3",ko:"그녀는 내 친구예요.",words:["She","is","my","friend"],end:"."},

const ALL={};[...TEST,...BANK,...WRITE].forEach(x=>ALL[x.id]=x);

/* =========================================================
   기록 — 이 기기 안에만 저장돼요
   ========================================================= */
const KEY="engquiz_v2";
function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  s=s||{};
  s.box=s.box||{};      // 복습 상자 {문제id:{b:상자번호, due:날짜}}
  s.newIdx=s.newIdx||0; // 다음에 나올 새 문제 번호
  s.writeIdx=s.writeIdx||0;
  s.days=s.days||[];    // 하루 10분 끝낸 날짜들
  s.grad=s.grad||0;     // 졸업한 문제 수
  s.tests=s.tests||[];  // 레벨 테스트 기록
  if(!s.migrated){      // 예전 버전 테스트 기록 옮기기
    try{(JSON.parse(localStorage.getItem("engquiz_history_v1"))||[]).forEach(r=>s.tests.push({date:r.date,score:r.score,asked:r.asked||24,level:r.level}))}catch(e){}
    s.migrated=true;
  }
  return s;
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(ds,n){const[y,m,d]=ds.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}
function pretty(ds){if(ds.indexOf("-")<0)return ds;const[y,m,d]=ds.split("-").map(Number);return m+"월 "+d+"일";}

/* ---- 복습 상자: 틀리면 1번(다음 날) → 맞으면 2번(3일 뒤) → 3번(1주 뒤) → 졸업 ---- */
const GAP={1:1,2:3,3:7};
function updateBox(id,ok){
  const b=S.box[id];
  if(!ok){S.box[id]={b:1,due:addDays(today(),1)};return;}
  if(!b)return;                       // 처음 본 문제를 맞히면 상자에 안 넣어요
  if(b.b>=3){delete S.box[id];S.grad++;return;}
  const nb=b.b+1;S.box[id]={b:nb,due:addDays(today(),GAP[nb])};
}
function dueList(){return Object.keys(S.box).filter(id=>ALL[id]&&S.box[id].due<=today()).sort((a,b)=>S.box[a].due<S.box[b].due?-1:1);}
function streak(){
  let d=S.days.includes(today())?today():addDays(today(),-1),n=0;
  while(S.days.includes(d)){n++;d=addDays(d,-1);}
  return n;
}

/* =========================================================
   소리 — 기기에 들어있는 영어 목소리
   ========================================================= */
/* 또렷한 목소리를 앞에 둔 순서표. 기계 같은 목소리(Fred 등)는 쓰지 않아요.
   "목소리 설정"에서 고른 목소리가 있으면 그걸 먼저 써요 */
let voiceA=null,voiceB=null,enVoices=[];
let returnTo=null;   // 목소리 설정 뒤 돌아갈 화면 (풀던 문제)
const FEMALE_ORDER=["samantha","ava","allison","nicky","susan","karen","tessa","moira","serena","victoria","zira","jenny","aria"];
const MALE_ORDER=["aaron","daniel","evan","nathan","arthur","alex","tom","oliver","david","guy","mark","eric"];
const BAD=/(fred|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|junior|organ|superstar|trinoids|whisper|wobble|zarvox|ralph|kathy|princess|rocko|grandpa|grandma|eddy|flo|reed|sandy|shelley)/i;
function rankPick(order,list){
  const good=v=>/(premium|enhanced|natural|neural)/i.test(v.name);
  for(const n of order){
    const hits=list.filter(v=>v.name.toLowerCase().includes(n));
    if(hits.length)return hits.find(good)||hits[0];
  }
  return null;
}
function loadVoices(){
  if(!("speechSynthesis" in window))return;
  enVoices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)&&!BAD.test(v.name));
  const us=enVoices.filter(v=>/en[-_]US/i.test(v.lang));
  const pool=us.length?us:enVoices;
  const byName=n=>n&&enVoices.find(v=>v.name===n);
  voiceA=byName(S.voiceA)||rankPick(FEMALE_ORDER,pool)||rankPick(FEMALE_ORDER,enVoices)||pool[0]||null;
  if(S.voiceB==="same")voiceB=null;
  else voiceB=byName(S.voiceB)||rankPick(MALE_ORDER,pool)||rankPick(MALE_ORDER,enVoices)||null;
}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
/* 한 줄씩 차례로 읽고, 사람이 바뀔 때 잠깐 쉬어요 */
let speakToken=0;
function speak(audio,done){
  if(!("speechSynthesis" in window)){alert("이 기기에서는 소리가 나오지 않아요. 다른 브라우저로 열어보세요.");done&&done();return;}
  speechSynthesis.cancel();
  const lines=Array.isArray(audio)?audio:[audio];
  const my=++speakToken;
  const say=i=>{
    if(my!==speakToken)return;
    if(i>=lines.length){done&&done();return;}
    const u=new SpeechSynthesisUtterance(lines[i]);
    u.lang="en-US";u.rate=0.85;u.pitch=1;u.volume=1;
    const v=(Array.isArray(audio)&&i%2===1&&voiceB)?voiceB:voiceA;
    if(v)u.voice=v;
    u.onend=()=>setTimeout(()=>say(i+1),Array.isArray(audio)?600:0);
    speechSynthesis.speak(u);
  };
  say(0);
}
function stopSound(){speakToken++;if("speechSynthesis" in window)speechSynthesis.cancel();}
function scriptOf(q){
  if(!q.audio)return "";
  return Array.isArray(q.audio)?q.audio.map((t,j)=>(j%2?"B: ":"A: ")+t).join("<br>"):q.audio;
}

function sendMom(text){
  if(navigator.share){navigator.share({text}).catch(()=>{});return;}
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert("복사했어요! 카톡에 붙여넣어서 엄마에게 보내 주세요."),()=>prompt("아래 글을 복사해서 보내 주세요",text));return;}
  prompt("아래 글을 복사해서 보내 주세요",text);
}

/* =========================================================
   객관식 문제 한 개 그리기 (테스트·연습 공용)
   opts.feedback=true 이면 확인 후 정답·대본을 바로 보여줘요
   ========================================================= */
function renderMC(q,{head,tag,feedback,btnLabel,onDone,pre=null,onBack=null}){
  const order=shuffled(q.opts.map((_,i)=>i));          // 보기 순서 섞기
  let chosen=null,plays=0,checked=false;
  el(`${head||""}
   <div class="card">
     ${tag||""}
     ${q.audio?`<button class="play" id="play">🔊 듣기 <span id="pc">(2번 남음)</span></button>`:""}
     <div class="q">${q.q}</div>
     ${q.text?`<div class="passage">${q.text}</div>`:""}
     <div class="opts ${q.grid?"grid4":""}" id="opts">
       ${order.map((oi,k)=>`<button class="opt" data-o="${oi}">${q.grid?"":(k+1)+". "}${q.opts[oi]}</button>`).join("")}
       <button class="opt idk" data-o="-1">🤔 모르겠어요</button>
     </div>
     <div id="fb"></div>
     <button class="btn" id="next" disabled>${feedback?"확인":btnLabel}</button>
     ${onBack?`<button class="btn ghost" id="back">◀ 이전 문제</button>`:""}
   </div>`);
  const btns=[...document.querySelectorAll("#opts .opt")];
  if(onBack)document.getElementById("back").onclick=()=>{stopSound();onBack();};
  if(pre!==null){   // 앞에서 골랐던 답을 표시해 둬요
    chosen=pre;
    btns.forEach(x=>x.classList.toggle("sel",+x.dataset.o===pre));
    document.getElementById("next").disabled=false;
  }
  btns.forEach(b=>b.onclick=()=>{
    if(checked)return;
    chosen=+b.dataset.o;
    btns.forEach(x=>x.classList.toggle("sel",x===b));
    document.getElementById("next").disabled=false;
  });
  const pb=document.getElementById("play");
  if(pb)pb.onclick=()=>{
    if(plays>=2)return;plays++;pb.disabled=true;
    speak(q.audio,()=>{if(plays<2)pb.disabled=false;});
    document.getElementById("pc").textContent=plays>=2?"(다 들었어요)":`(${2-plays}번 남음)`;
    setTimeout(()=>{if(plays<2)pb.disabled=false;},15000);
  };
  const nb=document.getElementById("next");
  nb.onclick=()=>{
    if(chosen===null)return;
    const ok=chosen===q.ans;
    if(!feedback||checked){stopSound();onDone(ok,chosen);return;}
    // 연습: 바로 정답 보여주기
    checked=true;
    btns.forEach(x=>{
      x.disabled=true;x.classList.remove("sel");
      const o=+x.dataset.o;
      if(o===q.ans)x.classList.add("right");
      else if(o===chosen)x.classList.add("wrong");
    });
    const sc=scriptOf(q);
    document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">
      <b>${ok?"맞았어요! 👍":"괜찮아요, 다음에 다시 나와요 💪"}</b>
      ${ok?"":`<div>정답: <b>${q.opts[q.ans]}</b></div>`}
      ${sc?`<div class="script">🔊 ${sc}</div>`:""}
    </div>`;
    if(pb){pb.disabled=false;plays=0;document.getElementById("pc").textContent="(다시 듣기)";}
    nb.textContent=btnLabel;
  };
}

/* =========================================================
   영작 1칸: 단어 카드 순서 맞추기
   ========================================================= */
function renderWrite(w,{head,tag,btnLabel,onDone}){
  const order=shuffled(w.words.map((_,i)=>i));
  let line=[],checked=false;
  el(`${head||""}
   <div class="card">
     ${tag||""}
     <div class="q">카드를 눌러서 영어 문장을 만들어요</div>
     <div class="ko">${w.ko}</div>
     <div class="line" id="line"></div>
     <div class="pool" id="pool">${order.map(i=>`<button class="chip" data-i="${i}">${w.words[i]}</button>`).join("")}</div>
     <button class="opt idk" id="idk" style="width:100%;margin-top:12px">🤔 모르겠어요</button>
     <div id="fb"></div>
     <button class="btn" id="next" disabled>확인</button>
   </div>`);
  const lineEl=document.getElementById("line"),nb=document.getElementById("next");
  const poolBtns=[...document.querySelectorAll("#pool .chip")];
  function draw(){
    lineEl.innerHTML=line.map((i,k)=>`<button class="chip" data-k="${k}">${w.words[i]}</button>`).join("")+(line.length===w.words.length?`<span style="font-size:20px;font-weight:700">${w.end}</span>`:"");
    [...lineEl.querySelectorAll(".chip")].forEach(c=>c.onclick=()=>{if(checked)return;line.splice(+c.dataset.k,1);sync();});
  }
  function sync(){
    poolBtns.forEach(b=>b.classList.toggle("used",line.includes(+b.dataset.i)));
    draw();nb.disabled=line.length!==w.words.length;
  }
  poolBtns.forEach(b=>b.onclick=()=>{if(checked||line.includes(+b.dataset.i))return;line.push(+b.dataset.i);sync();});
  let ok=false;
  function check(gaveUp){
    checked=true;
    ok=!gaveUp&&line.map(i=>w.words[i]).join(" ")===w.words.join(" ");
    document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">
      <b>${ok?"완벽해요! 👍":"괜찮아요, 다음에 다시 나와요 💪"}</b>
      <div class="script" style="font-size:17px">${w.words.join(" ")}${w.end}</div></div>`;
    document.getElementById("idk").disabled=true;
    nb.disabled=false;nb.textContent=btnLabel;
  }
  document.getElementById("idk").onclick=()=>{if(!checked)check(true);};
  nb.onclick=()=>{if(!checked){check(false);return;}onDone(ok);};
}

let D=null;
function startDaily(){
  const items=dueList().slice(0,5).map(id=>({id,kind:"review"}));
  for(let i=0;i<3&&S.newIdx+i<BANK.length;i++)items.push({id:BANK[S.newIdx+i].id,kind:"new"});
  const wDue=items.some(x=>x.id[0]==="w");
  if(!wDue&&S.writeIdx<WRITE.length)items.push({id:WRITE[S.writeIdx].id,kind:"write"});
  D={items,i:0,res:[]};
  if(!items.length){el(`<div class="card"><h2>오늘은 풀 문제가 없어요</h2><p>새 문제를 엄마가 곧 넣어 줄 거예요. 엄마에게 알려 주세요!</p><button class="btn" id="h">처음으로</button></div>`);document.getElementById("h").onclick=home;return;}
  dailyShow();
}
function dailyShow(){
  currentScreen=dailyShow;
  const it=D.items[D.i],x=ALL[it.id],n=D.items.length;
  const pct=Math.round(D.i/n*100);
  const label={review:"📦 복습",new:"✨ 새 문제",write:"✏️ 문장 만들기"}[it.kind];
  const isW=it.id[0]==="w";
  const head=`<div class="top"><span>${D.i+1} / ${n} · ${label}</span><button class="vbtn" id="vset">🔊 목소리</button></div><div class="bar"><i style="width:${pct}%"></i></div>`;
  const tag=`<div class="tag ${it.kind==="review"?"review":""}">${it.kind==="review"?"지난번에 어려웠던 문제":(isW?"문장 만들기":x.type)}</div>`;
  const btnLabel=D.i===n-1?"끝내기":"다음";
  const done=ok=>{
    updateBox(it.id,ok);
    if(it.kind==="new")S.newIdx++;
    if(it.kind==="write")S.writeIdx++;
    save();
    D.res.push({id:it.id,kind:it.kind,ok});
    D.i++;
    if(D.i<n)dailyShow();else dailyEnd();
  };
  if(isW)renderWrite(x,{head,tag,btnLabel,onDone:done});
  else renderMC(x,{head,tag,feedback:true,btnLabel,onDone:done});
}
function dailyEnd(){
  if(!S.days.includes(today()))S.days.push(today());
  if(S.days.length>400)S.days=S.days.slice(-400);
  const cnt=k=>{const r=D.res.filter(x=>x.kind===k);return{ok:r.filter(x=>x.ok).length,n:r.length};};
  const rv=cnt("review"),nw=cnt("new"),wr=cnt("write");
  const parts=[];
  if(rv.n)parts.push(`복습 ${rv.ok}/${rv.n}`);
  if(nw.n)parts.push(`새 문제 ${nw.ok}/${nw.n}`);
  if(wr.n)parts.push(`문장 만들기 ${wr.ok?"성공":"다시 도전"}`);
  const wrongs=D.res.filter(x=>!x.ok).length;
  S.lastReport=`[영어 10분] ${pretty(today())} 완료 ✅\n${parts.join(" · ")}\n연속 ${streak()}일째 · 졸업한 문제 ${S.grad}개`+(wrongs?`\n틀린 ${wrongs}문제는 복습 상자에 넣었어요`:"");
  save();
  el(`<div class="card" style="text-align:center">
     <div class="tag">오늘 10분 끝</div>
     <div class="big">🎉</div>
     <p>${parts.join("<br>")}</p>
     <div class="stats"><div><b>${streak()}</b><span>연속 일수</span></div><div><b>${wrongs}</b><span>복습 상자로</span></div><div><b>${S.grad}</b><span>졸업한 문제</span></div></div>
     <button class="btn" id="send">📲 엄마에게 보내기</button>
     <button class="btn ghost" id="h">처음으로</button>
   </div>`);
  document.getElementById("send").onclick=()=>sendMom(S.lastReport);
  document.getElementById("h").onclick=home;
}

let T=null;
function testIntro(){
  el(`<div class="card">

function testShow(){
  currentScreen=testShow;
  const q=TEST[T.i],prev=TEST[T.i-1];
  let head=`<div class="top"><span>${q.sec} · ${T.i+1} / ${TEST.length}</span><button class="vbtn" id="vset">🔊 목소리</button></div><div class="bar"><i style="width:${Math.round(T.i/TEST.length*100)}%"></i></div>`;
  if(prev&&prev.band!==q.band)head=`<div class="card note"><b>잘했어요! 🎉</b> 다음 단계로 올라가요. 조금 더 어려워져요.</div>`+head;
  else if(prev&&prev.sec!==q.sec)head=`<div class="card note"><b>듣기 끝! 👏</b> 이번엔 읽기 문제예요. 소리는 안 나와요.</div>`+head;
  const saved=T.res[T.i];
  renderMC(q,{head,feedback:false,btnLabel:"다음",pre:saved?saved.chosen:null,
    onBack:T.i>0?()=>{T.i--;testShow();}:null,
    onDone:(ok,chosen)=>{
      const cur=T.i;
      T.res[cur]={ok,chosen};
      // 한 단계(8문제)가 끝났는데 6개 미만이면 여기서 멈춰요 (돌아가서 고칠 수 있어요)
      const bandEnd=cur===TEST.length-1||TEST[cur+1].band!==q.band;
      if(bandEnd){
        let c=0;for(let i=0;i<=cur;i++)if(TEST[i].band===q.band&&T.res[i]&&T.res[i].ok)c++;
        if(c<6||cur===TEST.length-1){testStop(cur,cur===TEST.length-1&&c>=6);return;}
      }
      T.i=cur+1;testShow();
    }});
}

     <div class="tag">레벨 테스트</div>
     <div class="big">${allDone?"🏁":"👏"}</div>
     <h2>${allDone?"모든 문제를 다 풀었어요!":"여기까지 풀었어요!"}</h2>
     <p>${allDone?"":"다음 단계는 지금은 조금 어려워요. 연습하고 다음에 도전해요.<br>"}고치고 싶은 답이 있으면 앞 문제로 돌아가세요.</p>
     <p class="muted">결과 보기를 누르면 답을 바꿀 수 없어요.</p>
     <button class="btn" id="end">결과 보기</button>
     <button class="btn ghost" id="back">◀ 앞 문제로 돌아가기</button>
   </div>`);
  document.getElementById("end").onclick=()=>testEnd(e);
  document.getElementById("back").onclick=()=>{T.i=e;testShow();};
}
function estimate(b){
  if(b[1]<4)return "6급 준비 단계";
  if(b[1]<6)return "6급 수준";
  if(b[2]<4)return "5급 수준";
  if(b[2]<6)return "4급 수준";
  if(b[3]<4)return "3급 수준";
  if(b[3]<6)return "2급 수준";
  return "1급 수준";
}
function testEnd(e){
  T.res=T.res.slice(0,e+1);   // 멈춘 곳까지만 채점해요
  const asked=T.res.length,band={1:0,2:0,3:0},bandN={1:0,2:0,3:0},types={};
  let score=0;
  T.res.forEach((r,i)=>{
    const q=TEST[i];bandN[q.band]++;
    if(r.ok){score++;band[q.band]++;}
    types[q.type]=types[q.type]||{ok:0,n:0};types[q.type].n++;if(r.ok)types[q.type].ok++;
    updateBox(q.id,r.ok);   // 틀린 문제는 복습 상자로
  });
  const level=estimate(band);
  S.tests.push({date:today(),score,asked,level});
  const wrongs=T.res.filter(r=>!r.ok).length;
  S.lastTestReport=`[영어 레벨 테스트] ${pretty(today())}\n${asked}문제 중 ${score}개 · ${level} (참고용)\n틀린 ${wrongs}문제는 복습 상자에 넣었어요`;
  save();
  const weak=Object.entries(types).filter(([k,v])=>v.ok/v.n<0.6).map(([k])=>k);
  const typeRows=Object.entries(types).map(([k,v])=>{
    const p=Math.round(v.ok/v.n*100),c=p>=75?"var(--ok)":p>=50?"var(--gold)":"var(--no)";
    return `<div class="row"><span>${k}</span><span>${v.ok}/${v.n}</span></div><div class="mini"><i style="width:${p}%;background:${c}"></i></div>`;
  }).join("");
  const bandName={1:"초급 (6·5급 문제)",2:"중급 (4·3급 문제)",3:"고급 (2·1급 문제)"};
  const bandRows=[1,2,3].map(k=>`<div class="row"><span>${bandName[k]}</span><span>${bandN[k]?band[k]+"/"+bandN[k]:"안 풀었어요"}</span></div>`).join("");
  const review=T.res.map((r,i)=>{
    const q=TEST[i],sc=scriptOf(q);
    return `<div class="review">
      <div><b>${i+1}.</b> ${q.q} <span class="${r.ok?"okc":"noc"}">${r.ok?"○":"✕"}</span></div>
      ${q.text?`<div class="script">${q.text}</div>`:""}
      ${sc?`<div class="script">🔊 ${sc}</div>`:""}
      ${r.ok?"":`<div class="muted">내 답: ${r.chosen===-1?"🤔 모르겠어요":q.opts[r.chosen]} → 정답: <b>${q.opts[q.ans]}</b></div>`}
    </div>`;
  }).join("");
  el(`<div class="card" style="text-align:center">
     <div class="tag">결과</div>
     <p>${asked}문제 중 <b>${score}</b>개 맞았어요</p>
     <div class="big">${level}</div>
     <p class="muted">JET 급수와 비슷한 기준으로 추정한 참고용 결과예요.</p>
     ${wrongs?`<p>📦 틀린 ${wrongs}문제는 복습 상자에 넣었어요. 내일부터 하루 10분에서 다시 나와요.</p>`:""}
     <button class="btn" id="send">📲 엄마에게 보내기</button>
   </div>
   <div class="card"><h2>단계별</h2>${bandRows}</div>
   <div class="card"><h2>유형별</h2>${typeRows}
     ${weak.length?`<p style="margin-top:14px">💪 더 연습할 부분: <b>${weak.join(", ")}</b></p>`:`<p style="margin-top:14px">🎉 모든 유형이 고르게 좋아요!</p>`}
   </div>
   <div class="card"><h2>문제 다시 보기</h2>${review}</div>
   <button class="btn ghost" id="h">처음으로</button>`);
  document.getElementById("send").onclick=()=>sendMom(S.lastTestReport);
  document.getElementById("h").onclick=home;
}

home();
</script>
</body>
</html>
